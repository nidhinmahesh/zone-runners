[package]
name = "zone_runners"
version = "0.1.0"
description = "Zone Runners — DePIN coverage zone racing on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "zone_runners"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.29.0", features = ["token"] }
